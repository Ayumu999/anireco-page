      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;

      body {

      .mono { font-family: "JetBrains Mono", monospace; }

        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;

      .scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .scene-shell,
      .scene-fill {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .scene-shell { opacity: 0; overflow: hidden; }
      .photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: center center;
        will-change: transform;

      .photo-shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(10, 20, 32, 0.16) 0%, rgba(10, 20, 32, 0.02) 52%, rgba(10, 20, 32, 0.38) 100%);

        right: 96px;

      .micro-label {
        position: absolute;
        left: 96px;
        top: 98px;
        color: var(--ink);
        font-size: 22px;
        font-weight: 700;
        line-height: 1;

        height: 18px;
        border-radius: 50%;
        background: var(--lime);
        box-shadow: 0 0 0 10px rgba(163, 230, 53, 0.18);

      .aerial-copy { font-size: 30px; font-weight: 800; }

      #arrival-photo { object-position: center 48%; }

        color: var(--ink);

      .arrival-kicker { color: var(--lime); font-size: 20px; font-weight: 800; }
      .arrival-title { font-size: 50px; line-height: 1.1; font-weight: 900; }

        display: flex;
        align-items: center;
        gap: 14px;

        background: rgba(10, 20, 32, 0.66);
        color: var(--ink);
        font-size: 20px;
        font-weight: 800;

      .arrival-distance::before {
        content: "";

        height: 10px;
